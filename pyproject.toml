[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apimend"
dynamic = ["version"]
description = "Dependabot for APIs: detect breaking changes in the APIs you use, and only suggest fixes that pass tests."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
apimend = "apimend.cli:main"
[tool.setuptools.dynamic]
version = { attr = "apimend.__version__" }
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100