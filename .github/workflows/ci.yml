name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false  # do not leave a GitHub token on disk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install apimend and tools (same script as Codespaces)
        run: bash .devcontainer/setup.sh

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check src tests

      - name: Run tests
        run: pytest -v
