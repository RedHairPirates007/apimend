name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install apimend and tools (same script as Codespaces)
        run: bash .devcontainer/setup.sh

      - name: Lint
        run: ruff check .
        
      - name: Check formatting
        run: ruff format --check src tests
      - name: Run tests
        run: pytest -v